name: Tests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
env:
  CARGO_TERM_COLOR: always
jobs:
  sonarqube:
    name: SonarQube
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  test-coverage:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@b8754f8d90a8b8d772debe289ed3b159ea057fe6 # cargo-nextest
      - uses: taiki-e/install-action@e891bb389537b38fb955c19833f884ca3188a61d # cargo-llvm-cov
      - name: format
        run: cargo fmt --check
      - name: lint
        run: cargo clippy -- -D warnings
      - name: Test w/ aws-lc-rs (default feature)
        run: cargo llvm-cov nextest --profile ci
      - name: Test w/ ring (optional feature)
        run: >
          cargo llvm-cov nextest
          --no-default-features
          --features ring
          -- --skip scram_p521_sha512
      - name: Generate coverage report
        run: cargo llvm-cov report --codecov --output-path coverage.json
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  test-all-versions:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ["13", "14", "15", "16", "17", "18", "19beta4"]
        rust: ["1.88", "stable", "nightly"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set Rust Toolchain
        run: |
          rustup install ${{ matrix.rust }}
          rustup override set ${{ matrix.rust }}
      - uses: taiki-e/install-action@b8754f8d90a8b8d772debe289ed3b159ea057fe6 # cargo-nextest
      - name: Test w/ aws-lc-rs (default feature)
        env:
          POSTGRES_VERSION: ${{ matrix.postgres }}
        run: |
          if [ ${{ matrix.postgres}} -ge 17 ]; then
            cargo nextest run --no-fail-fast
          else
            cargo nextest run --no-fail-fast -- --skip ssl_direct_negotiation
          fi
      - name: Test w/ ring (optional feature)
        env:
          POSTGRES_VERSION: ${{ matrix.postgres }}
        run: |
          if [ ${{ matrix.postgres}} -ge 17 ]; then
            cargo nextest run \
            --no-default-features \
            --features ring \
            -- --skip scram_p521_sha512
          else
            cargo nextest run \
            --no-default-features \
            --features ring \
            -- \
            --skip ssl_direct_negotiation \
            --skip scram_p521_sha512
          fi
